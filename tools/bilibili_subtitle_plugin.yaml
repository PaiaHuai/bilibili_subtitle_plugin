identity:
  name: bilibili_subtitle_plugin
  author: paiahuai
  label:
    en_US: Bilibili Subtitle Extractor
    zh_Hans: 哔哩哔哩字幕提取器
    pt_BR: Extrator de Legendas do Bilibili
description:
  human:
    en_US: Extract subtitles from Bilibili videos by providing a video ID
    zh_Hans: 通过提供视频ID从哔哩哔哩视频中提取字幕
    pt_BR: Extrair legendas de vídeos do Bilibili fornecendo um ID de vídeo
  llm: "This tool extracts subtitles from Bilibili videos. It requires a valid Bilibili video ID in BV format (e.g., 'BV1GJ411x7h7') or AV format (e.g., 'av170001' or just '170001') and returns the subtitle content. Use this tool when users want to get the transcript or subtitles from a Bilibili video."
parameters:
  - name: video_id
    type: string
    required: true
    label:
      en_US: Video ID
      zh_Hans: 视频ID
      pt_BR: ID do vídeo
    human_description:
      en_US: The Bilibili video ID (BV number or AV number) from which to extract subtitles
      zh_Hans: 要提取字幕的哔哩哔哩视频ID（BV号或AV号）
      pt_BR: O ID do vídeo do Bilibili (número BV ou AV) do qual extrair legendas
    llm_description: "The Bilibili video ID in BV format (e.g., 'BV1GJ411x7h7') or AV format (e.g., 'av170001' or just '170001'). This should be the video identifier, not the full URL."
    form: llm
  - name: part
    type: number
    required: false
    default: 1
    label:
      en_US: Part Number
      zh_Hans: 分P号
      pt_BR: Número da Parte
    human_description:
      en_US: The part number of the video to extract subtitles from (default is 1)
      zh_Hans: 要提取字幕的视频分P号（默认为1）
      pt_BR: O número da parte do vídeo para extrair legendas (padrão é 1)
    llm_description: "The part number of the video to extract subtitles from (default is 1). This is used for videos that have multiple parts (分P). If the video has only one part, this can be left as default."
    form: llm
  - name: subtitle_lang
    type: select
    required: false
    label:
      en_US: Subtitle Language
      zh_Hans: 字幕语言
      pt_BR: Idioma da Legenda
    human_description:
      en_US: Optional. Select which subtitle language to fetch. If not selected, prefer Chinese.
      zh_Hans: 可选。选择要拉取的字幕语言；未选择时按默认逻辑优先拉取中文。
      pt_BR: Opcional. Selecione o idioma da legenda. Se não selecionado, prefere chinês.
    llm_description: "Optional. The subtitle language to fetch. If empty, the tool will use the default behavior (prefer Chinese subtitles, otherwise use the first available subtitle)."
    form: form
    options:
      - value: "zh-Hans"
        label:
          en_US: Chinese
          zh_Hans: 中文
      - value: "en-US"
        label:
          en_US: English
          zh_Hans: 英文
      - value: "ja"
        label:
          en_US: Japanese
          zh_Hans: 日本語
      - value: "ko"
        label:
          en_US: Korean
          zh_Hans: 韩语
      - value: "de-DE"
        label:
          en_US: German
          zh_Hans: 德语
      - value: "ru"
        label:
          en_US: Russian
          zh_Hans: 俄语
output_schema:
  type: object
  properties:
    subtitles:
      type: string
      description: The extracted subtitle content from the video
    video_title:
      type: string
      description: The title of the video
    video_author:
      type: string
      description: The author/uploader of the video
    subtitle_language:
      type: string
      description: The language of the extracted subtitles
    total_parts:
      type: number
      description: Total number of parts (pages) of the video
    current_part:
      type: number
      description: The current part number used/requested
extra:
  python:
    source: tools/bilibili_subtitle_plugin.py
